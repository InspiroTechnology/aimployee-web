<div class="payload-input">
  <mat-form-field appearance="fill">
    <mat-label>Enter your query</mat-label>
    <input matInput [(ngModel)]="payload.query" placeholder="Type your query here">
  </mat-form-field>
  <button mat-raised-button color="primary" (click)="sendQuery()">Send</button>
</div>

<div class="chat-output">
  <p>{{ fullAnswer }}</p>
</div>
